<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — College Complaint Management System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">

  <div id="navbar-container"></div>

  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="custom-card p-4 p-sm-5 shadow-sm">
          
          <div class="text-center mb-4">
            <div class="rounded-circle bg-primary-subtle text-primary d-inline-flex p-3 mb-2">
              <i class="bi bi-shield-lock fs-2"></i>
            </div>
            <h3 class="fw-bold">Sign In</h3>
            <p class="text-muted small">Access your Student, Staff, or Admin Portal</p>
          </div>

          <!-- Quick Test Credentials Filler -->
          <div class="mb-4 p-3 bg-light rounded border">
            <div class="small fw-bold text-secondary mb-2"><i class="bi bi-lightning-charge-fill text-warning me-1"></i>Quick Demo Login (1-Click Fill):</div>
            <div class="d-flex flex-wrap gap-2">
              <button type="button" class="btn btn-sm btn-outline-primary" onclick="fillCredentials('student.alex@college.edu', 'Student@123')">
                <i class="bi bi-person me-1"></i>Student
              </button>
              <button type="button" class="btn btn-sm btn-outline-warning text-dark" onclick="fillCredentials('staff.ramesh@college.edu', 'Staff@123')">
                <i class="bi bi-tools me-1"></i>Staff
              </button>
              <button type="button" class="btn btn-sm btn-outline-danger" onclick="fillCredentials('admin@college.edu', 'Admin@123')">
                <i class="bi bi-shield me-1"></i>Admin
              </button>
            </div>
          </div>

          <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="mb-3">
              <label for="email" class="form-label fw-semibold">Email Address</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                <input type="email" class="form-control" id="email" name="email" required placeholder="name@college.edu">
              </div>
            </div>

            <div class="mb-4">
              <label for="password" class="form-label fw-semibold">Password</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input type="password" class="form-control" id="password" name="password" required placeholder="••••••••">
              </div>
            </div>

            <button type="submit" id="loginBtn" class="btn btn-primary w-100 py-2 fw-semibold">
              <i class="bi bi-box-arrow-in-right me-1"></i> Log In
            </button>
          </form>

          <div class="text-center mt-4 pt-3 border-top small text-muted">
            <p class="mb-1">Don't have an account? <a href="/register.html" class="fw-semibold text-primary">Register as Student, Staff, or Faculty</a></p>
            <p class="mb-0">Want to report as a guest? <a href="/report.html" class="fw-semibold text-secondary">Continue as Guest</a></p>
          </div>

        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/socket.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      Auth.renderNavbar('login');
      // If already logged in, redirect to respective dashboard
      if (Auth.isLoggedIn()) {
        const role = Auth.getRole();
        if (role === 'admin') window.location.href = '/admin-dashboard.html';
        else if (role === 'staff') window.location.href = '/staff-dashboard.html';
        else window.location.href = '/student-dashboard.html';
      }
    });

    function fillCredentials(email, pass) {
      document.getElementById('email').value = email;
      document.getElementById('password').value = pass;
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('loginBtn');

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Logging in...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const result = await res.json();

        if (result.success && result.data) {
          Auth.setSession(result.data.token, result.data.user);
          showToast(`Welcome back, ${result.data.user.name}!`, 'success');
          
          setTimeout(() => {
            const urlParams = new URLSearchParams(window.location.search);
            const redirect = urlParams.get('redirect');
            if (redirect) {
              window.location.href = redirect;
              return;
            }

            if (result.data.user.role === 'admin') window.location.href = '/admin-dashboard.html';
            else if (result.data.user.role === 'staff') window.location.href = '/staff-dashboard.html';
            else window.location.href = '/student-dashboard.html';
          }, 800);
        } else {
          showToast(result.message || 'Invalid email or password', 'error');
          btn.disabled = false;
          btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-1"></i> Log In';
        }
      } catch (err) {
        console.error('Login error:', err);
        showToast('Server connection failed.', 'error');
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-1"></i> Log In';
      }
    }
  </script>
</body>
</html>
