<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Registration — College Complaint Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">

  <div id="navbar-container"></div>

  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-6">
        <div class="custom-card p-4 p-sm-5 shadow-sm">
          
          <div class="text-center mb-4">
            <div class="rounded-circle bg-success-subtle text-success d-inline-flex p-3 mb-2">
              <i class="bi bi-person-plus-fill fs-2"></i>
            </div>
            <h3 class="fw-bold">Create Account</h3>
            <p class="text-muted small">Register as a student, staff member, or faculty member</p>
          </div>

          <form id="registerForm" onsubmit="handleRegister(event)">
            <div class="row g-3 mb-3">
              <div class="col-sm-12">
                <label for="name" class="form-label fw-semibold">Full Name *</label>
                <input type="text" class="form-control" id="name" required placeholder="e.g. Alex Mercer">
              </div>

              <div class="col-sm-12">
                <label for="email" class="form-label fw-semibold">College Email Address *</label>
                <input type="email" class="form-control" id="email" required placeholder="student.name@college.edu">
              </div>

              <div class="col-sm-6">
                <label for="studentId" class="form-label fw-semibold">Student ID / Roll No</label>
                <input type="text" class="form-control" id="studentId" placeholder="e.g. STU-2024-089">
              </div>

              <div class="col-sm-6">
                <label for="department" class="form-label fw-semibold">Department</label>
                <select class="form-select" id="department">
                  <option value="Computer Science">Computer Science</option>
                  <option value="Information Technology">Information Technology</option>
                  <option value="Electronics & Comm.">Electronics & Comm.</option>
                  <option value="Mechanical Engineering">Mechanical Engineering</option>
                  <option value="Civil Engineering">Civil Engineering</option>
                  <option value="Electrical Engineering">Electrical Engineering</option>
                  <option value="Management Studies">Management Studies</option>
                  <option value="Other">Other</option>
                </select>
              </div>

              <div class="col-sm-6">
                <label for="year" class="form-label fw-semibold">Academic Year</label>
                <select class="form-select" id="year">
                  <option value="1st Year">1st Year</option>
                  <option value="2nd Year">2nd Year</option>
                  <option value="3rd Year">3rd Year</option>
                  <option value="4th Year">4th Year</option>
                  <option value="Postgraduate">Postgraduate</option>
                </select>
              </div>

              <div class="col-sm-6">
                <label for="password" class="form-label fw-semibold">Password *</label>
                <input type="password" class="form-control" id="password" required minlength="6" placeholder="Min. 6 chars">
              </div>

              <div class="col-sm-12">
                <label for="accountRole" class="form-label fw-semibold">Account Type *</label>
                <select class="form-select" id="accountRole">
                  <option value="student">Student</option>
                  <option value="staff">Staff</option>
                  <option value="faculty">Faculty</option>
                </select>
              </div>
            </div>

            <button type="submit" id="regBtn" class="btn btn-primary w-100 py-2 fw-semibold mt-2">
              <i class="bi bi-person-check-fill me-1"></i> Register Account
            </button>
          </form>

          <div class="text-center mt-4 pt-3 border-top small text-muted">
            <p class="mb-0">Already registered? <a href="/login.html" class="fw-semibold text-primary">Sign In here</a></p>
          </div>

        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/socket.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      Auth.renderNavbar('register');
      updateRoleFields();
      document.getElementById('accountRole').addEventListener('change', updateRoleFields);
    });

    function updateRoleFields() {
      const role = document.getElementById('accountRole').value;
      const studentIdField = document.getElementById('studentId').closest('.col-sm-6');
      const yearField = document.getElementById('year').closest('.col-sm-6');

      if (role === 'student') {
        studentIdField.classList.remove('d-none');
        yearField.classList.remove('d-none');
        document.getElementById('studentId').required = false;
        document.querySelector('label[for="department"]').textContent = 'Department';
      } else {
        studentIdField.classList.add('d-none');
        yearField.classList.add('d-none');
        document.getElementById('studentId').value = '';
        document.getElementById('year').value = '';
        document.querySelector('label[for="department"]').textContent = role === 'faculty' ? 'Faculty Department' : 'Staff Department';
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const studentId = document.getElementById('studentId').value.trim();
      const department = document.getElementById('department').value;
      const year = document.getElementById('year').value;
      const accountRole = document.getElementById('accountRole').value;
      const btn = document.getElementById('regBtn');

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Creating account...';

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password, studentId, department, year, role: accountRole })
        });

        const result = await res.json();

        if (result.success && result.data) {
          Auth.setSession(result.data.token, result.data.user);
          showToast('Account created successfully!', 'success');
          setTimeout(() => {
            if (accountRole === 'staff' || accountRole === 'faculty') {
              window.location.href = '/staff-dashboard.html';
            } else {
              window.location.href = '/student-dashboard.html';
            }
          }, 800);
        } else {
          showToast(result.message || 'Registration failed', 'error');
          btn.disabled = false;
          btn.innerHTML = '<i class="bi bi-person-check-fill me-1"></i> Register Account';
        }
      } catch (err) {
        console.error('Registration error:', err);
        showToast('Server connection failed.', 'error');
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-person-check-fill me-1"></i> Register Account';
      }
    }
  </script>
</body>
</html>
